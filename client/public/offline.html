<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>NextStation — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: #facc15;
      color: #020617;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 900;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 32px rgba(250,204,21,0.15);
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #94a3b8; max-width: 320px; line-height: 1.6; }
    .retry-btn {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0f172a;
      color: #facc15;
      font-weight: 700;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #1e293b; }
    .hint {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="icon">N</div>
  <h1>Connect to Ride</h1>
  <p>You're currently offline. NextStation needs a network connection to sync music with fellow metro riders.</p>
  <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  <p class="hint">Make sure you're connected to Wi-Fi or mobile data, then tap "Try Again".</p>
</body>
</html>
